# Supabase project settings for iRun. Local development uses `pnpm db:start`.
project_id = "irun"

[api]
enabled = true

[db]
major_version = 17

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
# One account only: create it with scripts/create-owner.ts.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
deno_version = 2

# Strava's redirect carries no user JWT. The function checks the session itself.
[functions.strava-oauth]
verify_jwt = false

# Strava's hub challenge and events carry no user JWT. The handler checks the verify token.
[functions.strava-webhook]
verify_jwt = false

# Cron calls this with the service key. The function checks that key itself.
[functions.strava-worker]
verify_jwt = false

# Nightly reconcile uses the same service key. Backfill keeps the user JWT.
[functions.strava-reconcile]
verify_jwt = false

# Sunday cron uses the service key. A manual refresh uses the user JWT. The function checks either one.
[functions.insights-weekly]
verify_jwt = false
